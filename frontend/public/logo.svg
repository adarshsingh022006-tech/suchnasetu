<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bridgeMain" x1="10" y1="50" x2="90" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Clean Outer Shield Ring -->
  <circle cx="50" cy="50" r="44" stroke="#E2E8F0" stroke-width="2.5" fill="#FFFFFF"/>

  <!-- Bridge Arch Structure -->
  <path d="M 20 68 C 30 38, 70 38, 80 68" stroke="url(#bridgeMain)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 26 68 C 35 48, 65 48, 74 68" stroke="#93C5FD" stroke-width="2" opacity="0.8"/>

  <!-- Vertical Suspension Pillars -->
  <line x1="34" y1="51" x2="34" y2="68" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="2 1.5"/>
  <line x1="42" y1="44" x2="42" y2="68" stroke="#1D4ED8" stroke-width="1.5" stroke-dasharray="2 1.5"/>
  <line x1="50" y1="41" x2="50" y2="68" stroke="#1E3A8A" stroke-width="2"/>
  <line x1="58" y1="44" x2="58" y2="68" stroke="#1D4ED8" stroke-width="1.5" stroke-dasharray="2 1.5"/>
  <line x1="66" y1="51" x2="66" y2="68" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="2 1.5"/>

  <!-- Bridge Base Roadbed -->
  <line x1="16" y1="68" x2="84" y2="68" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Connected Information Nodes -->
  <circle cx="20" cy="68" r="4" fill="#1E3A8A" />
  <circle cx="50" cy="41" r="5" fill="#2563EB" />
  <circle cx="80" cy="68" r="4" fill="#0284C7" />
  
  <!-- Discovered Information Dark Spot (Amber Alert Beacon) -->
  <circle cx="50" cy="22" r="4.5" fill="#EA580C" />
  <circle cx="50" cy="22" r="8" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>
  <line x1="50" y1="28" x2="50" y2="35" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="1 1.5"/>
</svg>
